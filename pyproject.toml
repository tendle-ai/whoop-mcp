[project]
name = "whoop-mcp"
version = "0.1.0"
description = "Read-only WHOOP MCP connector by Tendle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
whoop-mcp = "whoop_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "whoop_mcp/assets"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
